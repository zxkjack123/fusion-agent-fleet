# Metadata for validation scripts — NOT consumed by OpenCode runtime
inbound_contract_text: |
  ## 委派合同 — Mandatory Structured Report
  
  ### 调用方需提供
  - `teaching_topic` (str, required): 教学主题/单元名称
  - `target_level` (enum, required): `UG` | `MS` | `PhD` | `mixed`
  - `material_type` (enum, required): `lecture_notes` | `slides` | `exercises` | `lab_guide` | `exam` | `syllabus`
  - `duration_estimate` (str, optional): 例如 `"90 min lecture"` 或 `"2 weeks"`
  - `prerequisites` (list[str], optional): 学生先修知识
  - `language` (enum, optional, default `zh`): `zh` | `en` | `bilingual`
  - `existing_materials` (list[path], optional): 已有讲义/PPT 可重用
  - `reference_books` (list[str], optional): 推荐参考教材
  
  ### Final Report 强制格式
  
  
  report_format_version: 1
  
  **Status**: COMPLETED (see execution log for task-level details)
  输出必须以 `**Status**` 行开头（`COMPLETED` / `PARTIAL` / `BLOCKED`），按 Workflow Stage E 输出：(1) 教学材料文件路径；(2) 学习目标（Bloom 分类）；(3) 大纲与时长分配；(4) 关键概念清单；(5) 练习/作业（含答案）；(6) 引用与图表来源；(7) Pre-Delivery Audit 标记。
  
