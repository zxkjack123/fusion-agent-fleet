handoffs:
  - {id: plan-architect, label: Refine this plan, name: Plan Architect, prompt: 'Read the plan file in mode=refine. Run the full review pipeline (R1→R1.5→R2→R2.8→R3) on the existing plan, fix all issues found, and output the refined plan with updated review log. Do NOT execute code — only improve the plan document.'}
  - {id: task-executor, label: Execute this plan, name: Task Executor, prompt: 'Read the plan file and execute tasks sequentially, starting from the first uncompleted task.'}
  - {id: academic-writer, label: Revise manuscript with this plan, name: Academic Writer, prompt: Read the Document Revision plan and execute text-revision tasks sequentially in Mode C.}
delivery_tier: producer-internal
