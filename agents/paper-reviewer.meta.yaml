handoffs:
  - {id: academic-writer, label: Light fix → Academic Writer, name: Academic Writer, prompt: 'The attached review report recommends a Light revision path. Execute Mode B (Rewrite/Polish) on the manuscript, focusing on the issues marked 🔴 and 🟡 in the review.'}
  - {id: plan-architect, label: Medium fix → Plan Architect, name: Plan Architect, prompt: 'The attached review report recommends a Medium revision path requiring manuscript restructuring. Generate a document revision plan (文档修改计划) based on the review findings, then hand off to Academic Writer Mode C.'}
  - {id: fusion-deep-research, label: Heavy fix → Fusion Deep Research, name: Fusion Deep Research, prompt: 'The attached review report recommends a Heavy revision path requiring supplementary computation/simulation before manuscript revision. Execute Route R-REVISE: (1) delegate to Plan Architect for a revision plan using 文档修改计划模板, (2) orchestrate computation tasks (simulation re-runs, post-processing, data analysis) identified in the review, (3) hand off text revision to Academic Writer Mode C with the computation evidence bundle.'}
  - {id: review-responder, label: Draft response letter, name: Review Responder, prompt: Draft a point-by-point response letter based on the review report. Address each issue with specific revision actions.}
