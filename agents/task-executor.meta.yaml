trace_contract: |
  Task Executor writes span records to traces/trace.jsonl per instructions/tracing.instructions.md.
  Sub-agents delegated to must return [TOKENS: in=N, out=N, reason=N] as the first line of response.

delegation_contract_deep_reviewer: |
  When TE enters auto-heal loop (stop condition #2), delegates to deep-reviewer with:
  target_files: [<affected_source_files>, '.agent-runs/auto-heal-context-<task_id>.md']
  mode: deep
  focus_areas: ['error_diagnosis', 'code_fix']
  severity_floor: error
