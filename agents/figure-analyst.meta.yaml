# Metadata for validation scripts — NOT consumed by OpenCode runtime
inbound_contract_text: |
  ## 委派合同 — Mandatory Structured Report
  
  ### 调用方需提供
  
  | Field | Required | Description |
  |-------|----------|-------------|
  | `figure_paths` | Yes | List of file paths to figure images (PNG, JPG, PDF). |
  | `task_description` | Yes | What to do with each figure: `"chart_reading"` (extract numerical data from plots), `"data_extraction"` (pull specific values), `"content_interpretation"` (explain what the diagram/chart means), `"qa"` (answer specific questions about the figure). |
  | `context` | No | Surrounding manuscript text, caption, or document snippet that provides context for interpreting the figure. |
  | `extraction_mode` | No | `"auto"` (default — detect figure type and choose method), `"numeric"` (focus on quantitative data), `"descriptive"` (focus on qualitative description), `"qa"` (answer questions from task_description). |
  
  ### 返回格式
  
  Always return a structured report following the Output Template below. The report is the **sole deliverable** of this agent.
  
outbound_schemas_text: |
  ## Outbound Delegation Schemas
  
  > This section documents all sub-agent delegations. Field names must mirror the callee's `### 调用方需提供` section.
  
  ### Critical Thinking
  **When to delegate**: See workflow body for trigger conditions.
  **Required prompt fields** (see `.opencode/agent/critical-thinking.md` → `### 调用方需提供`):
  - See callee inbound contract for current field list.
  Expected return shape: See `.opencode/agent/critical-thinking.md` → `### Final Report 强制格式`.
  
return_envelope_text: |
  ### Final Report 强制格式
  
  report_format_version: 1
  
  **Status**: COMPLETED (see execution log for task-level details)
  
  | Section | Content |
  |---------|---------|
  | **Status** | COMPLETED | ✅ |
  | **Summary** | Figure analysis results | ✅ |
  | **Artifacts** | Extracted data paths | ✅ |
  | **Test Results** | N/A | ❌ |
  | **Commit** | <hash> | ✅ |
  
delegates:
  - {id: critical-thinking, name: Critical Thinking}
delivery_tier: sub-only
revision: 4
argument_hint: "Provide figure file paths (list) + task description (chart reading / data extraction / content interpretation) + context (optional: manuscript/document text) → structured content extraction report."
